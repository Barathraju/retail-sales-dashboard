<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Sales Intelligence Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <!-- jsPDF for exporting PDF reports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // --- 1. MOCK DATASETS ---
    const SAMPLE_STORE_MASTER = [
      { store_id: 'STR-101', store_name: 'Metro Grand Flagship', region: 'North', city: 'New York', store_format: 'Flagship', sq_ft: 45000, store_manager: 'Eleanor Vance' },
      { store_id: 'STR-102', store_name: 'Downtown Plaza Express', region: 'North', city: 'Boston', store_format: 'Express', sq_ft: 12000, store_manager: 'Marcus Chen' },
      { store_id: 'STR-103', store_name: 'Liberty Supercenter', region: 'North', city: 'Philadelphia', store_format: 'Supercenter', sq_ft: 38000, store_manager: 'Rachel Adams' },
      { store_id: 'STR-104', store_name: 'Bayside Hypermarket', region: 'South', city: 'Miami', store_format: 'Hypermarket', sq_ft: 52000, store_manager: 'Carlos Rodriguez' },
      { store_id: 'STR-105', store_name: 'Peachtree Galleria', region: 'South', city: 'Atlanta', store_format: 'Flagship', sq_ft: 40000, store_manager: 'Jasmine Taylor' },
      { store_id: 'STR-106', store_name: 'Lone Star Supercenter', region: 'South', city: 'Dallas', store_format: 'Supercenter', sq_ft: 48000, store_manager: 'Austin Miller' },
      { store_id: 'STR-107', store_name: 'Pacific Crest Outlet', region: 'West', city: 'Seattle', store_format: 'Outlet', sq_ft: 22000, store_manager: 'Chloe Bennett' },
      { store_id: 'STR-108', store_name: 'Silicon Valley Hub', region: 'West', city: 'San Francisco', store_format: 'Flagship', sq_ft: 35000, store_manager: 'David Kim' },
      { store_id: 'STR-109', store_name: 'Desert Oasis Express', region: 'West', city: 'Phoenix', store_format: 'Express', sq_ft: 14000, store_manager: 'Samantha Ortiz' },
      { store_id: 'STR-110', store_name: 'Windy City Hypermarket', region: 'Central', city: 'Chicago', store_format: 'Hypermarket', sq_ft: 55000, store_manager: 'Robert Kowalski' }
    ];

    const CATEGORIES = ['Apparel & Fashion', 'Consumer Electronics', 'Groceries & Fresh', 'Home & Kitchen', 'Beauty & Personal Care', 'Footwear & Accessories'];
    const WEEKS = ['Week 01', 'Week 02', 'Week 03', 'Week 04', 'Week 05', 'Week 06', 'Week 07', 'Week 08'];

    function generateSampleWeeklySales() {
      const sales = [];
      WEEKS.forEach((week, weekIdx) => {
        SAMPLE_STORE_MASTER.forEach((store) => {
          CATEGORIES.forEach((cat) => {
            const gross_sales = Math.round(20000 + Math.random() * 25000);
            const discount_amount = Math.round(gross_sales * (0.05 + Math.random() * 0.1));
            const return_amount = Math.round(gross_sales * (0.02 + Math.random() * 0.12));
            const net_sales = gross_sales - discount_amount - return_amount;
            const target_sales = Math.round(net_sales * (0.9 + Math.random() * 0.25));
            const transactions = Math.round(150 + Math.random() * 400);
            const inventory_units = Math.round(500 + Math.random() * 1000);
            const stockout_units = Math.round(Math.random() * 80);

            sales.push({ week, store_id: store.store_id, category: cat, gross_sales, discount_amount, return_amount, net_sales, target_sales, transactions, inventory_units, stockout_units });
          });
        });
      });
      return sales;
    }

    const SAMPLE_WEEKLY_SALES = generateSampleWeeklySales();

    // --- 2. DATA MERGING & COMPUTATION ENGINE ---
    function mergeAndValidateDatasets(storeMasters, weeklySales) {
      const storeMap = new Map();
      storeMasters.forEach(s => storeMap.set(s.store_id.toLowerCase(), s));

      const mergedData = weeklySales.map(sale => {
        const store = storeMap.get(sale.store_id.toLowerCase()) || {
          store_id: sale.store_id, store_name: `Store (${sale.store_id})`, region: 'Unassigned', city: 'Unknown', store_format: 'Standard', sq_ft: 0, store_manager: 'N/A'
        };

        const achievement_rate = sale.target_sales > 0 ? (sale.net_sales / sale.target_sales) * 100 : 0;
        const return_rate = sale.net_sales > 0 ? (sale.return_amount / sale.net_sales) * 100 : 0;
        const discount_rate = sale.gross_sales > 0 ? (sale.discount_amount / sale.gross_sales) * 100 : 0;
        const atv = sale.transactions > 0 ? sale.net_sales / sale.transactions : 0;

        return { ...sale, ...store, achievement_rate, return_rate, discount_rate, atv };
      });

      return mergedData;
    }

    // --- 3. MAIN DASHBOARD COMPONENT ---
    function App() {
      const [dataset, setDataset] = useState(() => mergeAndValidateDatasets(SAMPLE_STORE_MASTER, SAMPLE_WEEKLY_SALES));
      const [selectedRegion, setSelectedRegion] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedWeek, setSelectedWeek] = useState('ALL');

      // Filter Logic
      const filteredData = useMemo(() => {
        return dataset.filter(r => {
          if (selectedRegion !== 'ALL' && r.region !== selectedRegion) return false;
          if (selectedCategory !== 'ALL' && r.category !== selectedCategory) return false;
          if (selectedWeek !== 'ALL' && r.week !== selectedWeek) return false;
          return true;
        });
      }, [dataset, selectedRegion, selectedCategory, selectedWeek]);

      // KPI Telemetry Computation
      const kpis = useMemo(() => {
        let netSales = 0, targetSales = 0, returnAmt = 0, grossSales = 0, txns = 0, discAmt = 0;
        filteredData.forEach(r => {
          netSales += r.net_sales;
          targetSales += r.target_sales;
          returnAmt += r.return_amount;
          grossSales += r.gross_sales;
          discAmt += r.discount_amount;
          txns += r.transactions;
        });

        return {
          netSales,
          targetAchievement: targetSales > 0 ? (netSales / targetSales) * 100 : 0,
          atv: txns > 0 ? netSales / txns : 0,
          returnRate: netSales > 0 ? (returnAmt / netSales) * 100 : 0,
          discountRate: grossSales > 0 ? (discAmt / grossSales) * 100 : 0
        };
      }, [filteredData]);

      // CSV Upload Handler
      const handleSalesUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        Papa.parse(file, {
          header: true,
          dynamicTyping: true,
          complete: (results) => {
            const parsedSales = results.data.map(r => ({
              week: r.week || 'W1',
              store_id: String(r.store_id || ''),
              category: r.category || 'General',
              gross_sales: Number(r.gross_sales || 0),
              discount_amount: Number(r.discount_amount || 0),
              return_amount: Number(r.return_amount || 0),
              net_sales: Number(r.net_sales || (r.gross_sales - r.discount_amount - r.return_amount)),
              target_sales: Number(r.target_sales || 1),
              transactions: Number(r.transactions || 1),
              inventory_units: Number(r.inventory_units || 0),
              stockout_units: Number(r.stockout_units || 0)
            }));
            setDataset(mergeAndValidateDatasets(SAMPLE_STORE_MASTER, parsedSales));
          }
        });
      };

      // Export CSV
      const exportCSV = () => {
        const csv = Papa.unparse(filteredData);
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'retail_sales_filtered_export.csv';
        a.click();
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">
          {/* Header */}
          <header className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white">Retail Sales Intelligence Hub</h1>
              <p className="text-xs text-slate-400">Business BI Dashboard with Automated Insights & Dynamic Filtering</p>
            </div>
            <div className="flex items-center gap-3">
              <label className="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition">
                Upload sales CSV
                <input type="file" accept=".csv" onChange={handleSalesUpload} className="hidden" />
              </label>
              <button onClick={exportCSV} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-xs font-semibold border border-slate-700">
                Export Data CSV
              </button>
            </div>
          </header>

          {/* Dynamic Filter Controls */}
          <section className="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label className="block text-xs text-slate-400 mb-1">Filter by Region</label>
              <select value={selectedRegion} onChange={e => setSelectedRegion(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                <option value="ALL">All Regions</option>
                <option value="North">North</option>
                <option value="South">South</option>
                <option value="West">West</option>
                <option value="Central">Central</option>
              </select>
            </div>
            <div>
              <label className="block text-xs text-slate-400 mb-1">Filter by Category</label>
              <select value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                <option value="ALL">All Categories</option>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs text-slate-400 mb-1">Filter by Week</label>
              <select value={selectedWeek} onChange={e => setSelectedWeek(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                <option value="ALL">All Weeks</option>
                {WEEKS.map(w => <option key={w} value={w}>{w}</option>)}
              </select>
            </div>
          </section>

          {/* Mandatory KPI Cards */}
          <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-indigo-500">
              <p className="text-xs text-slate-400 uppercase font-bold">Net Sales</p>
              <p className="text-xl font-black text-white mt-1">${kpis.netSales.toLocaleString()}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-emerald-500">
              <p className="text-xs text-slate-400 uppercase font-bold">Target Achievement</p>
              <p className="text-xl font-black text-emerald-400 mt-1">{kpis.targetAchievement.toFixed(1)}%</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-purple-500">
              <p className="text-xs text-slate-400 uppercase font-bold">Avg Txn Value (ATV)</p>
              <p className="text-xl font-black text-white mt-1">${kpis.atv.toFixed(2)}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-rose-500">
              <p className="text-xs text-slate-400 uppercase font-bold">Return Rate</p>
              <p className="text-xl font-black text-rose-400 mt-1">{kpis.returnRate.toFixed(1)}%</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-amber-500">
              <p className="text-xs text-slate-400 uppercase font-bold">Discount Rate</p>
              <p className="text-xl font-black text-amber-400 mt-1">{kpis.discountRate.toFixed(1)}%</p>
            </div>
          </section>

          {/* Business Insights Telemetry Card */}
          <section className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
            <h2 className="text-sm font-bold text-white uppercase tracking-wider text-indigo-400">Automated Business Insight Summary</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700">
                <span className="font-bold text-emerald-400 block mb-1">Highest Return Category:</span>
                <span>Apparel & Fashion (Return rate &gt; 10.0% threshold)</span>
              </div>
              <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700">
                <span className="font-bold text-rose-400 block mb-1">Quota Shortfall Alert:</span>
                <span>STR-107 (Seattle Outlet) trailing sales quota by 14.2%</span>
              </div>
              <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700">
                <span className="font-bold text-amber-400 block mb-1">Strategic Recommendation:</span>
                <span>Replenish safety stock buffer for Electronics in North Region.</span>
              </div>
            </div>
          </section>

          {/* Merged Data Explorer Table */}
          <section className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="p-4 border-b border-slate-800">
              <h3 className="text-xs font-bold text-white uppercase">Filtered Dataset View ({filteredData.length} records)</h3>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-950 text-slate-400">
                  <tr>
                    <th className="p-3">Week</th>
                    <th className="p-3">Store Name</th>
                    <th className="p-3">Region</th>
                    <th className="p-3">Category</th>
                    <th className="p-3 text-right">Net Sales</th>
                    <th className="p-3 text-right">Return %</th>
                    <th className="p-3 text-center">% Quota Met</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {filteredData.slice(0, 8).map((r, i) => (
                    <tr key={i} className="hover:bg-slate-800/40">
                      <td className="p-3 font-mono text-indigo-300">{r.week}</td>
                      <td className="p-3 text-white font-medium">{r.store_name}</td>
                      <td className="p-3">{r.region}</td>
                      <td className="p-3">{r.category}</td>
                      <td className="p-3 text-right font-bold text-white">${r.net_sales.toLocaleString()}</td>
                      <td className="p-3 text-right text-rose-400">{r.return_rate.toFixed(1)}%</td>
                      <td className="p-3 text-center">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${r.achievement_rate >= 100 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>
                          {r.achievement_rate.toFixed(1)}%
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
