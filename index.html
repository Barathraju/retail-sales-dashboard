<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retail Sales Intelligence Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // Helper: Safe number parsing to prevent NaN errors
    const safeNum = (val, fallback = 0) => {
      if (val === null || val === undefined) return fallback;
      const clean = String(val).replace(/[\$,%]/g, '').trim();
      const num = parseFloat(clean);
      return isNaN(num) ? fallback : num;
    };

    const SAMPLE_STORES = [
      { store_id: 'STR-101', store_name: 'Metro Flagship', region: 'North', city: 'New York' },
      { store_id: 'STR-102', store_name: 'Plaza Express', region: 'North', city: 'Boston' },
      { store_id: 'STR-103', store_name: 'Liberty Center', region: 'South', city: 'Miami' },
      { store_id: 'STR-104', store_name: 'Pacific Hub', region: 'West', city: 'Seattle' },
      { store_id: 'STR-105', store_name: 'Windy Hypermarket', region: 'Central', city: 'Chicago' }
    ];

    const CATEGORIES = ['Apparel & Fashion', 'Consumer Electronics', 'Groceries & Fresh', 'Home & Kitchen'];
    const WEEKS = ['Week 01', 'Week 02', 'Week 03', 'Week 04'];

    function generateMockData() {
      const sales = [];
      WEEKS.forEach(week => {
        SAMPLE_STORES.forEach(store => {
          CATEGORIES.forEach(cat => {
            const gross = Math.round(15000 + Math.random() * 20000);
            const disc = Math.round(gross * 0.1);
            const ret = Math.round(gross * 0.05);
            const net = gross - disc - ret;
            sales.push({
              week,
              store_id: store.store_id,
              store_name: store.store_name,
              region: store.region,
              city: store.city,
              category: cat,
              gross_sales: gross,
              discount_amount: disc,
              return_amount: ret,
              net_sales: net,
              target_sales: Math.round(net * 1.1),
              transactions: Math.round(100 + Math.random() * 200)
            });
          });
        });
      });
      return sales;
    }

    // Chart Canvas Component
    function RenderChart({ type, data, options }) {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }
        chartInstanceRef.current = new Chart(canvasRef.current, { type, data, options });
        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [data, type]);

      return <canvas ref={canvasRef} />;
    }

    function App() {
      const [dataset, setDataset] = useState(generateMockData);
      const [regionFilter, setRegionFilter] = useState('ALL');

      const filtered = useMemo(() => {
        return dataset.filter(r => regionFilter === 'ALL' || r.region === regionFilter);
      }, [dataset, regionFilter]);

      const kpis = useMemo(() => {
        let net = 0, target = 0, ret = 0, gross = 0, txns = 0;
        filtered.forEach(r => {
          net += safeNum(r.net_sales);
          target += safeNum(r.target_sales, 1);
          ret += safeNum(r.return_amount);
          gross += safeNum(r.gross_sales);
          txns += safeNum(r.transactions, 1);
        });

        return {
          netSales: net,
          targetAchievement: target > 0 ? (net / target) * 100 : 0,
          atv: txns > 0 ? net / txns : 0,
          returnRate: net > 0 ? (ret / net) * 100 : 0
        };
      }, [filtered]);

      // Dynamic Dual-CSV Parser (Handles both sales and store files)
      const handleFileUpload = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        files.forEach(file => {
          Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
              const rows = results.data.map(r => {
                const gross = safeNum(r.gross_sales || r.gross || 0);
                const disc = safeNum(r.discount_amount || r.discount || 0);
                const ret = safeNum(r.return_amount || r.returns || 0);
                const net = r.net_sales !== undefined ? safeNum(r.net_sales) : Math.max(0, gross - disc - ret);

                return {
                  week: String(r.week || 'Week 01'),
                  store_id: String(r.store_id || 'STR-101'),
                  store_name: String(r.store_name || `Store ${r.store_id || ''}`),
                  region: String(r.region || 'North'),
                  city: String(r.city || 'Central'),
                  category: String(r.category || 'General'),
                  gross_sales: gross,
                  discount_amount: disc,
                  return_amount: ret,
                  net_sales: net,
                  target_sales: safeNum(r.target_sales || r.target, net || 1),
                  transactions: safeNum(r.transactions || r.txns, 100)
                };
              });
              setDataset(rows);
            }
          });
        });
      };

      // Chart Configurations
      const regionalChartData = useMemo(() => {
        const regions = ['North', 'South', 'West', 'Central'];
        const salesByRegion = regions.map(reg => {
          return filtered.filter(r => r.region === reg).reduce((acc, curr) => acc + safeNum(curr.net_sales), 0);
        });
        return {
          labels: regions,
          datasets: [{
            label: 'Net Sales ($)',
            data: salesByRegion,
            backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ec4899']
          }]
        };
      }, [filtered]);

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">
          {/* Header & File Upload */}
          <header className="bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white">Retail Sales Intelligence Hub</h1>
              <p className="text-xs text-slate-400">Live BI Analytics & Data Merging Dashboard</p>
            </div>
            <label className="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold">
              Upload Datasets (Select .CSV)
              <input type="file" accept=".csv" multiple onChange={handleFileUpload} className="hidden" />
            </label>
          </header>

          {/* Filter Bar */}
          <section className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center gap-4">
            <span className="text-xs text-slate-400 font-medium">Region Filter:</span>
            <select value={regionFilter} onChange={e => setRegionFilter(e.target.value)} className="bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
              <option value="ALL">All Regions</option>
              <option value="North">North</option>
              <option value="South">South</option>
              <option value="West">West</option>
              <option value="Central">Central</option>
            </select>
          </section>

          {/* Metric Cards */}
          <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-indigo-500">
              <p className="text-xs text-slate-400 font-bold uppercase">Net Sales</p>
              <p className="text-2xl font-black text-white mt-1">${kpis.netSales.toLocaleString()}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-emerald-500">
              <p className="text-xs text-slate-400 font-bold uppercase">Target Achievement</p>
              <p className="text-2xl font-black text-emerald-400 mt-1">{kpis.targetAchievement.toFixed(1)}%</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-purple-500">
              <p className="text-xs text-slate-400 font-bold uppercase">Avg Transaction Value</p>
              <p className="text-2xl font-black text-white mt-1">${kpis.atv.toFixed(2)}</p>
            </div>
            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl border-l-4 border-rose-500">
              <p className="text-xs text-slate-400 font-bold uppercase">Return Rate</p>
              <p className="text-2xl font-black text-rose-400 mt-1">{kpis.returnRate.toFixed(1)}%</p>
            </div>
          </section>

          {/* Visual Analytics Chart */}
          <section className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
            <h3 className="text-xs font-bold text-white uppercase tracking-wider">Regional Sales Analytics</h3>
            <div className="h-64">
              <RenderChart type="bar" data={regionalChartData} options={{ responsive: true, maintainAspectRatio: false }} />
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
